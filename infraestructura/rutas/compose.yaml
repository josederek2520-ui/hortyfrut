services:
  rutas:
    image: ghcr.io/project-osrm/osrm-backend@sha256:e1929ae2818226284d7ef007329098a30851c11528ab3712bc9c8d68da78278b
    command: osrm-routed --algorithm mld --threads 2 --max-viaroute-size 100 /datos/bolivia.osrm
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./.datos:/datos:ro
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
